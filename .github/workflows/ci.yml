name: Murex CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile backend/main.py
      - name: Validate SQL
        run: test -s database/schema.sql
