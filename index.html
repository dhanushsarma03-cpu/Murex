<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>MUREX Practice Environment</title><meta name="description" content="MUREX capital markets practice environment"><style>body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f5f6fa;color:#171525}*{box-sizing:border-box}.app{display:flex;min-height:100vh}.side{width:240px;background:linear-gradient(180deg,#4b176f,#29103f);color:white;padding:24px 16px}.brand{font-size:25px;font-weight:800;letter-spacing:2px}.sub{font-size:10px;color:#d9c6e7;margin:5px 0 30px}.nav{padding:12px 14px;border-radius:9px;margin:5px 0;color:#ddd;cursor:pointer}.nav.active,.nav:hover{background:#6d2a93;color:white}.main{flex:1;padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center}.title{font-size:27px;font-weight:750}.status{background:#e7f7ed;color:#187a43;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:25px 0}.card,.panel{background:white;border:1px solid #e7e4eb;border-radius:13px;padding:20px;box-shadow:0 3px 12px #24132b0a}.label{font-size:12px;color:#777}.value{font-size:26px;font-weight:750;margin-top:8px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.panel h3{margin-top:0}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #eee}.pill{padding:5px 9px;border-radius:15px;background:#f0e7f5;color:#63258a;font-size:11px;font-weight:700}.life{display:flex;justify-content:space-between;gap:8px;margin-top:20px}.step{text-align:center;flex:1;padding:12px;background:#f6f1f8;border-radius:9px;color:#63258a;font-size:12px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field label{display:block;font-size:12px;color:#666;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #dcd7e2;border-radius:8px}.btn{background:#592078;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:15px}.notice{margin-top:15px;padding:12px;background:#f4edf7;color:#552071;border-radius:8px;font-size:13px}@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:650px){.side{display:none}.main{padding:20px}.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">MUREX</div><div class="sub">PRACTICE ENVIRONMENT</div><div class="nav active" onclick="show('dashboard',this)">▦ Dashboard</div><div class="nav" onclick="show('trading',this)">⇄ Trading</div><div class="nav" onclick="show('market',this)">◈ Market Data</div><div class="nav" onclick="show('risk',this)">◉ Risk</div><div class="nav" onclick="show('reports',this)">▤ Reports</div><div class="nav" onclick="show('settings',this)">⚙ Settings</div></aside><main class="main"><div class="top"><div><div class="title" id="title">Dashboard</div><div class="label">Capital Markets Operations Workspace</div></div><div class="status">● UAT · ONLINE</div></div><div id="content"></div></main></div><script>
const data={trades:1284,pnl:'$2.41M',exposure:'$84.2M',issues:17};
function dashboard(){return `<div class="cards"><div class="card"><div class="label">TRADES TODAY</div><div class="value">${data.trades.toLocaleString()}</div></div><div class="card"><div class="label">NET P&L</div><div class="value">${data.pnl}</div></div><div class="card"><div class="label">OPEN EXPOSURE</div><div class="value">${data.exposure}</div></div><div class="card"><div class="label">BA EXCEPTIONS</div><div class="value">${data.issues}</div></div></div><div class="grid"><section class="panel"><h3>Recent Trades</h3><table class="table"><tr><th>Trade ID</th><th>Product</th><th>Side</th><th>Notional</th><th>Status</th></tr><tr><td>TRD-10284</td><td>FX Forward</td><td>BUY</td><td>€5.0M</td><td><span class="pill">BOOKED</span></td></tr><tr><td>TRD-10283</td><td>IRS</td><td>PAY</td><td>$25M</td><td><span class="pill">VALIDATED</span></td></tr><tr><td>TRD-10282</td><td>Bond</td><td>BUY</td><td>$8M</td><td><span class="pill">CONFIRMED</span></td></tr></table><h3 style="margin-top:25px">Trade Lifecycle</h3><div class="life"><div class="step">① Captured</div><div class="step">② Validated</div><div class="step">③ Booked</div><div class="step">④ Confirmed</div><div class="step">⑤ Settled</div></div></section><section class="panel"><h3>Market Snapshot</h3><p>EUR/USD <b>1.1652</b></p><p>USD/INR <b>88.01</b></p><p>US 10Y <b>4.05%</b></p><p>NIFTY 50 <b>25,112</b></p><h3 style="margin-top:25px">BA Issue Queue</h3><p><span class="pill">17 OPEN</span> Validation & lifecycle exceptions</p></section></div>`}
function trading(){return `<div class="panel" style="margin-top:25px"><h3>Trade Capture</h3><div class="form"><div class="field"><label>Product</label><select><option>FX Forward</option><option>Interest Rate Swap</option><option>Bond</option></select></div><div class="field"><label>Buy / Sell</label><select><option>BUY</option><option>SELL</option></select></div><div class="field"><label>Currency Pair</label><input value="EUR/USD"></div><div class="field"><label>Notional</label><input value="5000000"></div><div class="field"><label>Trade Date</label><input type="date" value="2026-09-10"></div><div class="field"><label>Settlement Date</label><input type="date" value="2026-09-15"></div><div class="field"><label>Counterparty</label><input value="Global Bank"></div><div class="field"><label>Rate</label><input value="1.1652"></div></div><button class="btn" onclick="validateTrade()">VALIDATE & BOOK</button><div id="notice"></div></div>`}
function simple(name,text){return `<div class="panel" style="margin-top:25px"><h3>${name}</h3><p>${text}</p><div class="notice">Module foundation ready. This area will be expanded with interactive BA practice workflows.</div></div>`}
function validateTrade(){document.getElementById('notice').innerHTML='<div class="notice">✓ Validation successful — trade TRD-10285 is ready for booking.</div>'}
function show(page,el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('title').textContent=page[0].toUpperCase()+page.slice(1);document.getElementById('content').innerHTML=page==='dashboard'?dashboard():page==='trading'?trading():page==='market'?simple('Market Data','Live-style market data workspace for rates, FX, bonds and reference data.'):page==='risk'?simple('Risk','Exposure, sensitivities, limits and exception analysis workspace.'):page==='reports'?simple('Reports','Operational, P&L, trade lifecycle and BA analysis reports.'):simple('Settings','Environment, reference data and user configuration.')}show('dashboard',document.querySelector('.nav'));
</script></body></html>
